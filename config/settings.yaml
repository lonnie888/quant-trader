# Market filter: skip opening new positions when market conditions are bad
# - 周末+坏时段: filter out weekends (Sat/Sun) and bad hours (UTC 0-3, 16-19)
# - 波动率>阈值 停: skip when 24h average volatility across all symbols exceeds threshold
# Recommended from H1 backtest (2026-01 to 2026-08): overall win rate 39.1%, 8月2H from -99.9% to +41.3%
market_filter:
  enabled: true
  no_weekend: true
  no_bad_hours: true
  bad_hours_utc: [0, 1, 2, 3, 16, 17, 18, 19]
  volatility_threshold_pct: 12.0  # 全币种 24h 平均波动率 > 此值时停手
  refresh_seconds: 14400  # 4 小时重新计算一次
  cache_path: "reports/paper/market_state.json"