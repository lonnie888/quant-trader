{% extends "layout.html" %}
{% block title %}K线数据 - Quant Trader{% endblock %}

{% block content %}
<h1 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6">📊 K线数据管理器</h1>

<!-- 顶部操作栏 -->
<div class="card mb-4">
    <div class="flex items-center gap-3 flex-wrap">
        <button class="btn" onclick="refreshScan()">🔄 重新扫描</button>
        <span id="cache-info" style="color:#848e9c; font-size:13px;"></span>
        <div class="ml-auto flex items-center gap-2">
            <input type="text" id="filter-symbol" placeholder="搜索币种..." class="w-[140px]"
                   oninput="renderTable()" style="box-sizing:border-box;">
            <select id="filter-start" class="w-[120px]" onchange="renderTable()">
                <option value="">全部起始时间</option>
                <option value="2025-01">2025-01 起</option>
                <option value="2025-06">2025-06 起</option>
                <option value="2026-01">2026-01 起</option>
                <option value="2026-08">2026-08 起</option>
            </select>
            <select id="filter-gaps" class="w-[110px]" onchange="renderTable()">
                <option value="">缺口: 全部</option>
                <option value="0">无缺口</option>
                <option value="1">有缺口</option>
            </select>
        </div>
    </div>
    <div class="mt-3 text-xs" style="color:#848e9c;" id="summary-line">加载中...</div>
</div>

<!-- 统计卡片 -->
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
    <div class="card" style="background:rgba(240,185,11,0.05);">
        <div class="label text-xs">总币种</div>
        <div class="text-2xl font-bold" id="stat-total">--</div>
    </div>
    <div class="card" style="background:rgba(14,203,129,0.05);">
        <div class="label text-xs">完整数据币种</div>
        <div class="text-2xl font-bold" id="stat-full">--</div>
    </div>
    <div class="card" style="background:rgba(246,70,93,0.05);">
        <div class="label text-xs">有缺口币种</div>
        <div class="text-2xl font-bold" id="stat-gaps">--</div>
    </div>
    <div class="card" style="background:rgba(240,185,11,0.05);">
        <div class="label text-xs">数据覆盖(中位)</div>
        <div class="text-2xl font-bold" id="stat-span">--</div>
    </div>
</div>

<!-- 币种表格 -->
<div class="card p-0">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>币种</th>
                    <th>行数</th>
                    <th>起始</th>
                    <th>结束</th>
                    <th>覆盖(天)</th>
                    <th>缺口(&gt;2h)</th>
                    <th>资金费</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="data-body">
                <tr><td colspan="8" style="text-align:center; color:#848e9c; padding:30px;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 选中币种详情 -->
<div class="card mt-4" id="detail-card" style="display:none;">
    <div class="flex items-center justify-between mb-3">
        <span class="label" style="font-size:14px;">📈 <span id="detail-symbol"></span> 月度K线分布</span>
        <button class="btn" onclick="closeDetail()">关闭</button>
    </div>
    <div id="detail-body" style="max-height:300px; overflow-y:auto;">
        <div id="detail-bars" style="display:flex; align-items:flex-end; gap:2px; height:80px;"></div>
        <div class="mt-2" id="detail-months" style="color:#848e9c; font-size:12px;"></div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/data.js"></script>
{% endblock %}
