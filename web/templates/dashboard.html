{% extends "layout.html" %}
{% block title %}总览 - Quant Trader{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">总览</h1>

<!-- 真实账户 KPI 卡片 -->
<div class="card mb-4" style="border-left: 4px solid #f0b90b;">
    <div class="label mb-3" style="color:#f0b90b; font-weight:bold;">💰 真实账户</div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 sm:gap-4">
        <div class="card" style="background:rgba(240,185,11,0.05);">
            <div class="label text-xs sm:text-xs">总权益</div>
            <div class="value text-xl sm:text-2xl md:text-3xl" id="real-equity">--</div>
        </div>
        <div class="card" style="background:rgba(240,185,11,0.05);">
            <div class="label text-xs sm:text-xs">可用余额</div>
            <div class="value text-xl sm:text-2xl md:text-3xl" id="real-available">--</div>
        </div>
        <div class="card" style="background:rgba(240,185,11,0.05);">
            <div class="label text-xs sm:text-xs">今日 PnL</div>
            <div class="value text-xl sm:text-2xl md:text-3xl" id="real-today-pnl">--</div>
        </div>
        <div class="card" style="background:rgba(240,185,11,0.05);">
            <div class="label text-xs sm:text-xs">总收益率</div>
            <div class="value text-xl sm:text-2xl md:text-3xl" id="real-total-return">--</div>
        </div>
        <div class="card" style="background:rgba(240,185,11,0.05);">
            <div class="label text-xs sm:text-xs">持仓数</div>
            <div class="value text-xl sm:text-2xl md:text-3xl" id="real-positions-count">--</div>
        </div>
    </div>
</div>

<!-- 真实账户权益曲线 -->
<div class="card mb-6">
    <div class="label mb-4">📈 真实账户权益曲线</div>
    <div id="real-equity-wrapper" style="height:250px;">
        <canvas id="realEquityChart"></canvas>
    </div>
</div>

<!-- 真实持仓 -->
<div class="card mb-6">
    <div class="flex items-center justify-between mb-4">
        <span class="label" style="color:#f0b90b;">💰 真实持仓</span>
    </div>
    <div class="table-wrap">
        <div id="real-positions-table">
            <p style="color:#848e9c; font-size:14px; padding:20px 0; text-align:center;">加载中...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/dashboard.js"></script>
{% endblock %}
